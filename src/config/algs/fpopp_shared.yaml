# --- FPO++，连续（Box(0,1)）动作空间，共享网络预设 ---
# 所有 agent 共用一个 actor（只靠 obs_agent_id one-hot 区分），一个联合优化
# 器/梯度裁剪，一个全局 anchor/reflow 惩罚，critic 是单一联合 V(s)，把同一个
# advantage 广播给所有 agent。ratio/surrogate 数学和完整的 config 轴说明见
# fpopp_learner.py 的 docstring；fpopp.yaml 是同一个 learner 的
# individual-actor 预设。
#
# critic_type: mafpo_shared_critic 完全没有 agent 条件化
# （SharedVCritic.per_agent_values=False），所以 learner 用一个宽度为 1 的
# advantage 广播给所有 agent——这要求 common_reward=True（在 learner 的
# __init__ 里会 assert）。

runner: "parallel"
mac: "mafpo_mac"
agent: "mafpo_actor"
learner: "fpopp_learner"
critic_type: "mafpo_shared_critic"
fpo_individual_agents: False
# 共享 actor 不管 fpo_actor_optim_per_agent 怎么设都只会有一个 Adam/一次裁
# 剪（这个开关对它是 no-op）；fpo_anchor_per_agent 设成 False 保持一致（对全
# 局均值算一个 hinge）——想在共享 actor 上也用逐 agent 的 anchor 就把它改成
# True。显式写出来（不留给 getattr 默认值），这样 sacred 才允许从命令行覆盖。
fpo_actor_optim_per_agent: False
fpo_anchor_per_agent: False

# 用子进程并行跑多个独立环境。
batch_size_run: 8

# 攒够大约 fpo_rollout_timesteps 步 transition（凑齐完整 episode）之后，训
# 练一次再清空 buffer。
buffer_size: 128
batch_size: 8
fpo_rollout_timesteps: 2048

# 每个 transition 存这么多个固定的 CFM 邻域探测点（ratio 的蒙特卡洛采样数）。
cfm_n_samples: 50
# exp() 之前 log-ratio 的上界（STE clamp，见 fpopp_learner.py），rho_s 的范
# 围因此是 (0, exp(cfm_rho_clip)]。
cfm_rho_clip: 0.3
cfm_target_type: "velocity"

# 算 ratio 的 diff 之前，old/new 单点 CFM MSE 各自先夹一个上界（new 侧是
# STE），防止一个离群探测点主导梯度。只影响算 diff 用的局部副本；mb_cfm_loss
# 本身、anchor_loss、reflow_loss、cfm_loss_mean* 诊断看到的都是原始未截断的
# 值。
cfm_loss_clip_max: 3.0

# rollout/eval 采样时 Euler 积分的步数（t=0 -> t=1）。
cfm_rollout_steps: 10

# actor 用 sigmoid（不是硬 clamp），所以 CFM 回归目标是无界的 x1_raw——速度
# 网络的输出要用 tanh 限幅到 [-cfm_velocity_bound, cfm_velocity_bound]，否则
# cfm_loss_mean 长跑会发散（见 mafpo_actor.py 的 velocity()）。
cfm_velocity_bound: 8.0

# anchor：CFM 回归误差超过 cfm_anchor_threshold 时启动的 hinge-squared 惩
# 罚，系数 cfm_anchor_coef（0 = 完全关闭）。默认关闭——不属于 FPO/FPO++ 的核
# 心 ratio 数学，只有 cfm_loss_clip_max + advantage normalize/clamp +
# grad_norm_clip 还不够用时才作为额外的稳定性手段打开。
cfm_anchor_threshold: 2.0
cfm_anchor_coef: 0.0

# reflow：Rectified Flow 自蒸馏直线度正则，跟 anchor 是两个独立开关（可以只
# 开一个、都开、或都不开）。同一套 hinge-squared 结构：
# reflow_loss = cfm_reflow_coef * [max(0, L_reflow - cfm_reflow_threshold)]^2
cfm_reflow_threshold: 0.01
cfm_reflow_coef: 0.0

# 打乱收集到的 rollout transition，训练 epochs 遍。
fpo_minibatch_size: 512
epochs: 2

# 这个 learner 不读这个 key（GAE baseline 用 rollout 时的 critic，没有
# target 网络）——留着是因为 default.yaml 里其它算法还在用它。
target_update_interval_or_tau: 0.01

# advantage 在整个有效 rollout 内 normalize（均值 0、标准差 1）之后的 clamp
# 范围，见 fpopp_learner.py 的 _compute_advantages_and_targets。
adv_clip: 5.0

# PPO2 式 value clip，见 fpopp.yaml 里的说明。<=0 关闭。
value_clip_eps: 0.2

lr: 0.00003   # actor 和 critic 的优化器都用这个学习率
grad_norm_clip: 10
hidden_dim: 128

obs_agent_id: True
obs_last_action: False
obs_individual_obs: False

use_rnn: True
standardise_returns: True
standardise_rewards: True
gae_lambda: 0.95
eps_clip: 0.05
name: "fpopp_shared"

use_wandb: True
wandb_team: "adolf9555-university-of-technology-sydney"
wandb_project: "MAFPO++"
wandb_run_name: "MAFPO++-shared-MPE"
wandb_mode: "online"

t_max: 20050000

# --- 2026-09-05 对齐官方 FPO++（amazon-far/fpo-control）新增的键，默认值即代码里
# 的 getattr 默认；显式写出来 sacred 才允许命令行覆盖。说明见 mafpo_mac.py 文件头
# 与 fpopp_learner.py 的 docstring。
fpo_action_map: "clip"         # "clip"（官方：线性映射 + 硬 clip，flow 只看未裁剪 x1）或 "sigmoid"（旧行为）
fpo_action_clip: 2.0           # clip 模式下 x1 in [-c, c] <-> action in [0,1]（官方 clip_actions=2.0）
fpo_action_perturb_std: 0.02   # rollout 时对 x1 的高斯扰动（官方 action_perturb_std），0 关闭
fpo_weight_decay: 0.0001       # decay 系数（官方 weight_decay=1e-4）；<=0 退回 Adam。注意 adams 下同一数值的收缩力约是 AdamW 的 1/sqrt(v_bar) 倍（看 wandb 的 swd_v_bar_sqrt）
fpo_optimizer: "adams"         # "adams"（Adam + Stable Weight Decay，Xie et al. 2023，components/adams.py）/ "adamw"（官方 FPO++）/ "adam"
fpo_trust_region: "ppo"        # "ppo"（原版 FPO：所有 A 都用标准 PPO clip）/ "aspo"（官方 FPO++：A<=0 用平滑 SPO，配套 cfm_loss_clip_max_neg_adv）
cfm_loss_huber_delta: 1.0      # CFM 回归误差的 modified Huber delta（官方 fine-tuning 版），0 = 纯 MSE
cfm_loss_reduction: "mean"     # action 维 reduction："mean" / "sum" / "sqrt"（官方 locomotion 默认 sqrt）
cfm_loss_clip_max_neg_adv: 3.0 # A<0 样本 new CFM loss 的单独上界（官方 cfm_loss_clamp_negative_advantages），只在 fpo_trust_region=aspo 下生效，默认等于 cfm_loss_clip_max
fpo_lr_schedule: "fixed"       # "adaptive" = 官方 schedule="adaptive"：按新旧 x1_pred 均方差调 lr（见 fpopp_learner._adapt_lr）
fpo_desired_kl: 0.01           # adaptive 模式的目标 KL 代理（官方 cartpole toy 配置 0.01，locomotion 1e-4）
# 速度场的时间嵌入维度：Fourier [cos(t*2^k), sin(t*2^k)]，k=0..d/2-1，等价于官方
# isaaclab_fpo 的 timestep_embed_dim（默认 8）。0 = 退回裸标量 t（旧行为，仅供 A/B
# 对照）。改这个值会改变 vel_fc1 的输入维度，旧 checkpoint 载不进来。
fpo_timestep_embed_dim: 8

fpo_pfo_coef: 0.0              # PFO（Moalla et al. 2024）：L + lambda*||phi_new - phi_old||^2，phi=速度网络倒数第二层预激活；0=关闭

# --- ADER：agent-wise 自适应 base-noise scale，见 fpopp.yaml 里的完整说
# 明——两个 preset 用的是同一个 learner，键完全一样。默认关闭，不影响现有
# baseline。
ader_enabled: False
ader_mode: "adaptive"          # "fixed" / "adaptive"（相对排序分配，总方差守恒）/ "gradient"（log k += ader_lr * EMA(dJ/dlog k)，每个 agent 独立升降）
ader_estimator: "pathwise"     # g 的估计方式："pathwise"（theta 固定，探测噪声 eps=s*z 走 reparam，autograd 对 log s 求 -dL_MAFPO/dlog s）/ "score"（score-function E[A*(||z||^2-d)]）
ader_lr: 1.0                   # gradient 模式的步长；g 已按 sqrt(2d) 归一，单批 g 的量级约 1e-2，单步再受 ader_max_log_k_step 限幅
ader_k_init: 1.0
ader_k_values: []              # fixed 模式下可传 n_agents 个值；为空则全用 ader_k_init
ader_warmup_updates: 10
ader_update_interval: 1
ader_ema_alpha: 0.05
ader_temperature: 1.0
ader_allocation_strength: 0.25
ader_k_min: 0.5
ader_k_max: 1.5
ader_max_log_k_step: 0.05
